# SonarCloud analysis (JS/TS) + Jest LCOV coverage.
#
# GitHub → Settings → Secrets and variables → Actions:
#   SONAR_TOKEN            — SonarCloud: Account → My Account → Security → Generate token
#   SONAR_ORGANIZATION     — SonarCloud project → Information → Organization key
#   SONAR_PROJECT_KEY      — SonarCloud project → Information → Project key
#
# Self-hosted SonarQube Server: see docs/SONARQUBE.md (different env; omit organization).

name: SonarQube

on:
  push:
    branches:
      - main
      - 'VT276-*'
  pull_request:
    branches:
      - main

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test (coverage for Sonar)
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
