# SonarQube / SonarCloud — Cab-Roaster-Mobile (Expo / React Native)
# Docs: https://docs.sonarqube.org/latest/analysis/analysis-parameters/
#
# ── SonarCloud (GitHub): set these three in this file OR pass -D to the scanner ──
#   sonar.organization=your-org-key
#   sonar.projectKey=your-org_Cab-Roaster-Mobile
# Create project at https://sonarcloud.io → analyze with GitHub Actions.
#
# ── Self-hosted SonarQube: omit sonar.organization; set in CI:
#   SONAR_HOST_URL, SONAR_TOKEN

sonar.projectName=Cab-Roaster-Mobile
sonar.projectVersion=1.0.0

# Source roots (JavaScript / React Native app code only)
sonar.sources=App.js,index.js,src
sonar.sourceEncoding=UTF-8

# Tests (for test execution reports / coverage linkage)
sonar.tests=__tests__
sonar.test.inclusions=**/__tests__/**/*.test.js,**/*.test.js

# Coverage from Jest (lcov) — produced by: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Do not count test files toward coverage gaps in application files
sonar.coverage.exclusions=**/__tests__/**,**/*.test.js,**/mocks/**,src/mocks/**,src/data/mockData.js,src/services/mock/**

# Excluded from analysis (noise, generated, deps, native build outputs)
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.expo/**,\
  **/dist/**,\
  **/web-build/**,\
  **/android/.gradle/**,\
  **/android/**/build/**,\
  **/android/app/build/**,\
  **/ios/build/**,\
  **/ios/Pods/**,\
  **/*.min.js,\
  **/package-lock.json

# Duplicate code: ignore small generated/config files
sonar.cpd.exclusions=**/__tests__/**,src/data/**,src/services/mock/**

# Security / JS (SonarJS): stricter than default when using a "strict" Quality Gate on the server
# sonar.javascript.environments=browser,node,es2022
