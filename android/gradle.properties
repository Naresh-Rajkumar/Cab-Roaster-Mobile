# Project-wide Gradle settings.
#
# --- Windows: New Architecture / CMake path length (build.gradle enforces unless disabled) ---
# If Gradle says "Windows path too long": run scripts\create-short-junction.cmd once, then open THIS repo ONLY
# via %USERPROFILE%\r in Android Studio (File > Open -> C:\Users\<you>\r). Delete android\app\.cxx, rebuild.
# Alternative: run android\enable-windows-long-paths.ps1 as Admin, reboot, then cabroster.nativeWindowsPathCheck=false
#
# --- Windows + Android Studio (transform AccessDenied / "Could not move temporary workspace") ---
# 1) Run: android\set-windows-gradle-home.bat  (sets GRADLE_USER_HOME to %LOCALAPPDATA%\CabRoasterGradle)
# 2) Android Studio: Settings > Build > Gradle > set "Gradle user home" to the SAME path (full path, e.g.
#    C:\Users\YOU\AppData\Local\CabRoasterGradle). Studio does not use gradlew.bat; without this it keeps using
#    %USERPROFILE%\.gradle and the error may persist.
# 3) Windows Security: add Defender folder exclusions for that Gradle home folder and this repo.
# 4) Fully quit Studio, then reopen the project.
#
# --- "Timeout waiting to lock build logic queue" / buildLogic.lock ---
# Two processes grabbed the same project (e.g. Android Studio + Cursor terminal gradlew, or two Studio windows).
# Close ALL of them, run android\stop-gradle-unlock.bat, reopen ONE client only, then sync.
#
# --- Ninja "Filename longer than 260 characters" (New Architecture / Fabric codegen) ---
# CMake writes object paths that include the full path to node_modules; deep paths like
# Documents\GitHub\...\Cab-Roaster-Mobile exceed the legacy Windows MAX_PATH limit.
# Fix A (recommended): Run PowerShell *as Administrator*: android\enable-windows-long-paths.ps1
#   then sign out or reboot. Clean: cd android && gradlew.bat clean (delete app\.cxx if needed).
# Fix B (no reboot): npm run android uses SUBST on Windows (see scripts/run-android-subst.cmd).
#   Or run: android\gradlew-from-subst-drive.cmd <tasks>. If R: is busy, edit the drive letter.
# Fix C: clone/move the repo to a short path (e.g. C:\dev\cab).
# Fix D (reliable on Windows): one-time cmd:  scripts\create-short-junction.cmd
#   Creates %USERPROFILE%\r -> this repo. Always open/build from %USERPROFILE%\r so paths are like
#   C:\Users\YOU\r\node_modules\... instead of ...\Documents\GitHub\...\Cab-Roaster-Mobile\...
#   (Ninja embeds the absolute source path in object file names.)
# Android Studio resolves the project to the real long path; the build.gradle check is disabled below.
# For native (CMake/Ninja) builds you still need long paths OR a short clone OR SUBST:
#   • Easiest: double-click android\enable-long-paths-elevated.cmd → approve UAC → REBOOT.
#   • Or: scripts\run-android-subst.cmd (builds via a short drive letter).
#   • Or: clone to e.g. C:\dev\cab
cabroster.nativeWindowsPathCheck=false

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
#
# Windows: if you see AccessDenied on .gradle\caches\...\transforms\*, Android Studio may be
# overriding these JVM args (Settings > Build Tools > Gradle). Align IDE Gradle JVM with this file.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# Windows: parallel transforms often hit "Could not move temporary workspace" (Defender/locks).
org.gradle.parallel=false
org.gradle.workers.max=1
# Reduces file watcher churn that can contribute to AccessDenied on transform folder renames.
org.gradle.vfs.watch=false

# Windows: Kotlin incremental caches under node_modules often fail to delete (AV/IDE locks).
kotlin.incremental=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false
